<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16587b" />
    <meta
      name="description"
      content="One for All SAT — a personal, Bluebook-style SAT practice tool with topic drills, timers, and a graphing calculator."
    />
    <title>One for All SAT</title>
    <!-- Fonts load from here rather than an @import in the stylesheet, so they start with the
         page instead of after the CSS. "optional" means a font that isn't ready for the first
         paint isn't swapped in mid-visit: swapping reflowed every line of text and pushed the
         page around (layout shift). It's cached for the next visit. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400..700&family=Noto+Serif:wght@400;600&family=Pixelify+Sans:wght@400..700&display=optional"
    />
    <script>
      // The theme, set before anything is drawn so a dark page never flashes light first.
      // Light unless another theme was picked. Kept in step with src/lib/theme.ts.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('ofa-sat:theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'bluebook' || saved === 'minecraft' ? saved : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics. Cookieless and no client-side state, so it doesn't touch
         the localStorage/IndexedDB the app keeps progress in. The token is a public beacon
         id, not a secret — it ships in the page source to every visitor. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "496c8d9902414b6ca48df0863bc74c9f"}'
    ></script>
  </body>
</html>
